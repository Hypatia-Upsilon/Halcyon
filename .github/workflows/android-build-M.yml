name: Android Build (M)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      package_name:
        description: "Temporary Package Name (Application ID) - Leave blank for default"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Halcyon
        uses: actions/checkout@v4

      # 1. 修复 sed 规则（正则兼容原有的 if 条件语句）
      - name: Temporarily override Application ID in build.gradle.kts
        if: ${{ inputs.package_name != '' }}
        run: |
          NEW_PACKAGE="${{ inputs.package_name }}"
          echo "正在将 app/build.gradle.kts 中的 applicationId 替换为: $NEW_PACKAGE"
          
          # 正则匹配整个 applicationId = ... 行
          sed -i 's/applicationId = .*/applicationId = "'"$NEW_PACKAGE"'"/g' app/build.gradle.kts
          
          echo "修改后的行验证："
          grep "applicationId =" app/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          if ! sdkmanager --channel=3 "platforms;android-37"; then
            echo "platforms;android-37 is unavailable from sdkmanager; using android-36 as a CI compatibility platform."
            sdkmanager "platforms;android-36"
            mkdir -p "$ANDROID_HOME/platforms/android-37"
            cp -a "$ANDROID_HOME/platforms/android-36/." "$ANDROID_HOME/platforms/android-37/"
            sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=37/' "$ANDROID_HOME/platforms/android-37/source.properties"
          fi
          sdkmanager --channel=3 "build-tools;37.0.0" || sdkmanager "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 2. 如果是 Release 构建，在编译前准备好 release.jks
      # 这样 Gradle 自身的 release 签名配置可以直接生效，重命名任务产出的 APK 也会带有正确的签名！
      - name: Prepare Signing Keystore for Release
        if: ${{ inputs.build_type == 'release' }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 -d > app/release.jks
            echo "Keystore successfully written to app/release.jks"
          fi

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          APP_ID_PARAM=""
          if [ -n "${{ inputs.package_name }}" ]; then
            APP_ID_PARAM="-PcustomApplicationId=${{ inputs.package_name }}"
          fi
          ./gradlew --no-daemon :app:assembleDebug -PellaAbi=arm64-v8a $APP_ID_PARAM --stacktrace

      - name: Build release APK
        if: ${{ inputs.build_type == 'release' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          RELEASE_STORE_FILE: app/release.jks
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APP_ID_PARAM=""
          if [ -n "${{ inputs.package_name }}" ]; then
            APP_ID_PARAM="-PcustomApplicationId=${{ inputs.package_name }}"
          fi
          ./gradlew --no-daemon :app:assembleRelease -PellaAbi=arm64-v8a $APP_ID_PARAM --stacktrace

      # 3. 兜底重新对所有生成出的 Release APK 执行 apksigner（包含 renamed-apk 目录）
      - name: Re-sign All Release APKs (Dual Verification)
        if: ${{ inputs.build_type == 'release' }}
        env:
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ ! -f "app/release.jks" ]; then
            echo "No keystore found, skipping manual resign."
            exit 0
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -n 1)
          
          # 同时遍历输出目录与重命名目录
          find app/build/outputs -type f \( -name "*release*.apk" -o -name "*release*.APK" \) | while read -r apk; do
            echo "Signing $apk ..."
            "$APKSIGNER" sign --ks app/release.jks \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KEY_STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              "$apk"
            echo "Verifying signature for $apk ..."
            "$APKSIGNER" verify --verbose "$apk"
          done
          
          # 清理私钥文件
          rm -f app/release.jks

      - name: Verify Package Name of Generated APKs
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | head -n 1)
          if [ -z "$AAPT2" ]; then
            echo "Error: aapt2 not found!"
            exit 1
          fi
          
          echo "=========================================="
          echo "       VERIFYING APK PACKAGE NAMES        "
          echo "=========================================="
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.APK" \) | while read -r apk; do
            echo "File: $apk"
            "$AAPT2" dump badging "$apk" | grep "package: name=" || echo "Could not read package name."
            echo "------------------------------------------"
          done

      - name: List APK outputs
        run: |
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.APK" \) -print -exec ls -lh {} \;

      # 4. 根据本次 build_type 动态选择上传路径，避免通配符未命中失败
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Halcyon-arm64-v8a-${{ inputs.build_type }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/${{ inputs.build_type }}/*arm64-v8a*.apk
            app/build/outputs/renamed-apk/${{ inputs.build_type }}/*arm64-v8a*.APK
          if-no-files-found: warn
