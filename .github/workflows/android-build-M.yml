name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      # 1. 保留临时包名输入框（可选填）
      package_name:
        description: "Temporary Package Name (Application ID) - Leave blank for default"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Halcyon
        uses: actions/checkout@v4

      # 2. 新增：如果输入了临时包名，则在内存中临时使用 sed 替换原文件的 applicationId
      - name: Temporarily override Application ID in build.gradle.kts
        if: ${{ inputs.package_name != '' }}
        run: |
          NEW_PACKAGE="${{ inputs.package_name }}"
          echo "正在将 app/build.gradle.kts 中的 applicationId 临时修改为: $NEW_PACKAGE"
          
          # 使用 sed 替换文件中对应的行
          sed -i 's/applicationId = "com.ella.music"/applicationId = "'"$NEW_PACKAGE"'"/g' app/build.gradle.kts
          
          # 打印修改后的行以供在日志中核对
          echo "修改后的行验证："
          grep "applicationId =" app/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          if ! sdkmanager --channel=3 "platforms;android-37"; then
            echo "platforms;android-37 is unavailable from sdkmanager; using android-36 as a CI compatibility platform."
            sdkmanager "platforms;android-36"
            mkdir -p "$ANDROID_HOME/platforms/android-37"
            cp -a "$ANDROID_HOME/platforms/android-36/." "$ANDROID_HOME/platforms/android-37/"
            sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=37/' "$ANDROID_HOME/platforms/android-37/source.properties"
          fi
          sdkmanager --channel=3 "build-tools;37.0.0" || sdkmanager "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 3. 恢复为原样编译命令，无需传递额外的 Gradle 参数
      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./gradlew --no-daemon :app:assembleDebug -PellaAbi=arm64-v8a --stacktrace

      # 4. 恢复为原样编译命令，无需传递额外的 Gradle 参数
      - name: Build release APK
        if: ${{ inputs.build_type == 'release' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./gradlew --no-daemon :app:assembleRelease -PellaAbi=arm64-v8a --stacktrace

      - name: Sign Release APK manually (Official apksigner)
        if: ${{ inputs.build_type == 'release' }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > release.jks
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "Error: apksigner not found in Android SDK!"
            exit 1
          fi
          echo "Using apksigner at: $APKSIGNER"
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              echo "Signing $apk ..."
              "$APKSIGNER" sign --ks release.jks \
                --ks-key-alias "$ALIAS" \
                --ks-pass "pass:$KEY_STORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                "$apk"
              echo "Verifying signature for $apk ..."
              "$APKSIGNER" verify --verbose "$apk"
            fi
          done
          rm -f release.jks

      # 5. 保留：使用 aapt2 自动提取 APK 信息并输出验证结果
      - name: Verify Package Name of Generated APKs
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | head -n 1)
          if [ -z "$AAPT2" ]; then
            echo "Error: aapt2 not found!"
            exit 1
          fi
          echo "Using aapt2 at: $AAPT2"
          
          echo "=========================================="
          echo "       VERIFYING APK PACKAGE NAMES        "
          echo "=========================================="
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.APK" \) | while read -r apk; do
            echo "File: $apk"
            "$AAPT2" dump badging "$apk" | grep "package: name=" || echo "Could not read package name."
            echo "------------------------------------------"
          done

      - name: List APK outputs
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} \;
          find app/build/outputs/renamed-apk -type f -name "*.APK" -print -exec ls -lh {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Halcyon-arm64-v8a-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            app/build/outputs/apk/release/*arm64-v8a*.apk
            app/build/outputs/renamed-apk/debug/*arm64-v8a*.APK
            app/build/outputs/renamed-apk/release/*arm64-v8a*.APK
          if-no-files-found: error
